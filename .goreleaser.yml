# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tfox

before:
  hooks:
    - go mod tidy

builds:
  - id: tfox
    main: .
    binary: tfox
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/andpalmier/tfox/cmd.Version={{.Version}}
      - -X github.com/andpalmier/tfox/cmd.Commit={{.ShortCommit}}
      - -X github.com/andpalmier/tfox/cmd.Date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

homebrew_casks:
  - name: tfox
    repository:
      owner: andpalmier
      name: homebrew-tap
    homepage: "https://github.com/andpalmier/tfox"
    description: "CLI tool to search in ThreatFox IOC database"
    directory: Casks
    # Homebrew quarantines what a cask downloads, and these binaries are neither
    # signed nor notarized, so macOS refuses to run them with "tfox is damaged
    # and cannot be opened". Formulae did not have this problem, so this is
    # required by the move to casks rather than optional.
    #
    # Clearing the quarantine attribute is a bypass: Apple may withdraw it, and
    # signing plus notarization is the durable answer. That needs an Apple
    # Developer account, so it is a separate decision.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tfox"]
          end

# One "docker buildx build" across both platforms, pushed as a single
# multi-platform image. A client pulling the tag gets the manifest for its own
# architecture, so there are no per-architecture tags to publish or stitch back
# together.
dockers_v2:
  - id: tfox
    images:
      - "ghcr.io/andpalmier/tfox"
    tags:
      - "{{ .Version }}"
      # "latest" must never move onto a prerelease. An empty tag is ignored.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "CLI tool to search in ThreatFox IOC database"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/andpalmier/tfox"
      org.opencontainers.image.licenses: "AGPL-3.0"

release:
  github:
    owner: andpalmier
    name: tfox
  draft: false
  prerelease: auto
